name: QuestionCraft Phase 2 CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ── 1-3. Lint, tests, Phase 2 pipeline ──────────────────────────────────────
  lint-and-test:
    name: Code Quality & Unit Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgomp1

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-deps -e .
        pip install scikit-learn xgboost pandas numpy scipy pyarrow nltk textstat pyyaml joblib click \
                    matplotlib mlflow fastapi uvicorn pydantic httpx pytest pytest-cov \
                    "ruff==0.4.5" "black==24.4.2"
        python -m nltk.downloader punkt punkt_tab averaged_perceptron_tagger averaged_perceptron_tagger_eng stopwords

    - name: Lint with Ruff
      run: ruff check src/ tests/ scripts/

    - name: Check Formatting with Black
      run: black --check --line-length 100 src/ tests/ scripts/

    - name: Run Unit & Integration Tests
      run: pytest tests/ -v --cov=src --cov-report=term-missing

    # Models, data and the MLflow registry are DVC/gitignored, so CI seeds small demo
    # artifacts. The pipeline runs non-strict here: registry-dependent checks (quality gates,
    # MLflow artifacts 5/6/9) can only pass on a machine with the trained registry.
    - name: Phase 2 Pipeline (quality gates, data validation, artifact check)
      run: |
        python scripts/seed_demo_artifacts.py
        python scripts/run_phase2_pipeline.py --skip-server

  # ── 4-5. Build image and smoke-test it ─────────────────────────────────────
  docker-build-and-smoke-test:
    name: Docker Build & Container Smoke Test
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Seed demo models (models/*.pkl are gitignored)
      run: |
        # Same scikit-learn / numpy as the image, so the seeded pickles load inside it
        pip install scikit-learn==1.9.1 numpy==2.5.4 pandas==3.0.6 joblib==1.6.0 pyarrow==25.0.1
        python scripts/seed_demo_artifacts.py

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Production Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        load: true
        tags: questioncraft-api:ci

    - name: Smoke test — container answers /health with 200
      run: |
        docker run -d --name qc -p 8000:8000 questioncraft-api:ci
        for i in $(seq 1 60); do
          code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost:8000/health || true)
          if [ "$code" = "200" ]; then break; fi
          sleep 2
        done
        echo "HTTP $code"; cat /tmp/health.json; echo
        test "$code" = "200"
        python -c "import json; h=json.load(open('/tmp/health.json')); assert all(h['models_loaded'].values()), h"
        curl -sf -X POST http://localhost:8000/predict -H 'content-type: application/json' \
             -d '{"question_text": "Define a binary search tree and state its properties."}'
        echo
        curl -sf http://localhost:8000/metrics | grep -q '^questioncraft_requests_total'

    - name: Container logs (on failure)
      if: failure()
      run: docker logs qc || true

    # Step 6 (push to a container registry on main) is an open question in the
    # Phase 2 scope and is intentionally not part of this workflow yet.
