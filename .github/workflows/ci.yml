name: QuestionCraft Phase 1 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-deps -e .
        pip install scikit-learn pandas numpy scipy nltk textstat pyyaml pytest pytest-cov ruff black
        python -m nltk.downloader punkt punkt_tab averaged_perceptron_tagger averaged_perceptron_tagger_eng stopwords

    - name: Lint with Ruff
      run: |
        ruff check src/ tests/ scripts/ || echo "Ruff check completed with notices"

    - name: Check Formatting with Black
      run: |
        black --check --line-length 100 src/ tests/ scripts/ || echo "Formatting check completed"

    - name: Run Automated Unit Tests
      run: |
        pytest tests/ -v
