# QuestionCraft — Horizontal Pod Autoscaler
# Auto-scales API replicas based on CPU utilisation
# Implements elastic scaling for exam-season traffic spikes
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: questioncraft-api-hpa
  namespace: questioncraft
  labels:
    app: questioncraft
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: questioncraft-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
