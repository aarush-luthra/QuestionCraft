# QuestionCraft — Kubernetes Ingress
# External routing for API endpoints
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: questioncraft-ingress
  namespace: questioncraft
  labels:
    app: questioncraft
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: questioncraft.rvce.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: questioncraft-api
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: questioncraft-api
                port:
                  number: 8000
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: questioncraft-api
                port:
                  number: 8000
