# QuestionCraft — Kubernetes Service
# Routes traffic to both production AND canary pods (shared selector: app=questioncraft, component=api)
apiVersion: v1
kind: Service
metadata:
  name: questioncraft-api
  namespace: questioncraft
  labels:
    app: questioncraft
spec:
  type: NodePort
  selector:
    app: questioncraft
    component: api
    # Note: does NOT select on 'track', so traffic goes to BOTH stable and canary pods
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30800
      protocol: TCP
