# QuestionCraft ConfigMap — externalised environment configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: questioncraft-config
  namespace: questioncraft
  labels:
    app: questioncraft
data:
  MLFLOW_TRACKING_URI: "sqlite:///mlflow.db"
  PYTHONPATH: "/app"
  LOG_LEVEL: "INFO"
  CANARY_RATIO: "0.0"
  PROMETHEUS_ENABLED: "true"
  SERVING_PORT: "8000"
