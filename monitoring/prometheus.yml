# =============================================================================
# Prometheus Configuration for QuestionCraft
# =============================================================================
# Scrapes metrics from:
#   - QuestionCraft FastAPI service (/metrics endpoint)
#   - Prometheus self-monitoring
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # ── Prometheus self-monitoring ─────────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ── QuestionCraft FastAPI Service ──────────────────────────────────────────
  - job_name: "questioncraft-api"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["questioncraft-api:8000"]
        labels:
          service: "questioncraft"
          environment: "production"
          phase: "2"

  # ── MLflow Tracking Server ─────────────────────────────────────────────────
  - job_name: "mlflow"
    metrics_path: "/metrics"
    scrape_interval: 30s
    static_configs:
      - targets: ["mlflow-server:5000"]
        labels:
          service: "mlflow"
