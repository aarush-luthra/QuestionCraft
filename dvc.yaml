# =============================================================================
# QuestionCraft — DVC Training & Evaluation Pipeline
# Data versions are tracked via data/raw.dvc and data/processed.dvc
# Run training pipeline: dvc repro
# =============================================================================

stages:

  # ── Stage 1: Train Difficulty Classifier ──────────────────────────────────
  train_difficulty:
    cmd: >
      python -m src.models.difficulty_classifier
        --config configs/model_config.yaml
        --model-out models/difficulty_classifier.pkl
    deps:
      - src/models/difficulty_classifier.py
      - data/processed
      - configs/model_config.yaml
    outs:
      - models/difficulty_classifier.pkl:
          cache: true
    params:
      - configs/model_config.yaml:
          - global.random_seed
          - global.test_size
          - tfidf
          - difficulty_classifier

  # ── Stage 2: Train Bloom's Taxonomy Classifier ────────────────────────────
  train_blooms:
    cmd: >
      python -m src.models.blooms_classifier
        --config configs/model_config.yaml
        --model-out models/blooms_classifier.pkl
    deps:
      - src/models/blooms_classifier.py
      - data/processed
      - configs/model_config.yaml
    outs:
      - models/blooms_classifier.pkl:
          cache: true
    params:
      - configs/model_config.yaml:
          - global.random_seed
          - global.test_size
          - tfidf
          - blooms_classifier

  # ── Stage 3: Train Computational Thinking (CT) Classifier ─────────────────
  train_ct:
    cmd: >
      python -m src.models.ct_classifier
        --config configs/model_config.yaml
        --model-out models/ct_classifier.pkl
    deps:
      - src/models/ct_classifier.py
      - data/processed
      - configs/model_config.yaml
    outs:
      - models/ct_classifier.pkl:
          cache: true
    params:
      - configs/model_config.yaml:
          - global.random_seed
          - global.test_size
          - tfidf
          - ct_classifier

  # ── Stage 4: Semantic Duplicate Detection ─────────────────────────────────
  detect_duplicates:
    cmd: >
      python -m src.models.duplicate_detector
        --config configs/model_config.yaml
        --input data/raw/rvce/question_bank.json
        --out-dir data/processed
    deps:
      - src/models/duplicate_detector.py
      - data/raw
      - configs/model_config.yaml
    outs:
      - data/processed/duplicates_question_bank.parquet:
          cache: true
    params:
      - configs/model_config.yaml:
          - duplicate_detector
