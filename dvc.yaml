# =============================================================================
# QuestionCraft — DVC Training & Evaluation Pipeline
# Data versions are tracked via data/raw.dvc and data/processed.dvc
# Run training pipeline: dvc repro
# =============================================================================

stages:

  # ── Stage 0: Clean, de-duplicate and split (public/proxy train vs RVCE held-out eval) ──
  build_splits:
    cmd: python -m src.data.build_splits --config configs/model_config.yaml
    deps:
      - src/data/build_splits.py
      - src/monitoring/model_tests.py
      - data/processed
      - data/raw/rvce
      - data/raw/public
    params:
      - configs/model_config.yaml:
          - splits
          - data.rvce_banks
          - data.public_banks
    outs:
      - data/splits

  # ── Stage 1: Train Difficulty Classifier ──────────────────────────────────
  train_difficulty:
    cmd: python -m src.models.difficulty_classifier --config configs/model_config.yaml --data-path data/splits/difficulty_train.parquet --eval-path data/splits/difficulty_rvce_eval.parquet --model-out models/difficulty_classifier.pkl
    deps:
      - src/models/difficulty_classifier.py
      - src/models/rvce_eval.py
      - data/splits
      - configs/model_config.yaml
    outs:
      - models/difficulty_classifier.pkl:
          cache: true
    params:
      - configs/model_config.yaml:
          - global.random_seed
          - global.test_size
          - tfidf
          - difficulty_classifier

  # ── Stage 2: Train Bloom's Taxonomy Classifier ────────────────────────────
  train_blooms:
    cmd: python -m src.models.blooms_classifier --config configs/model_config.yaml --data-path data/splits/blooms_train.parquet --eval-path data/splits/blooms_rvce_eval.parquet --model-out models/blooms_classifier.pkl
    deps:
      - src/models/blooms_classifier.py
      - src/models/rvce_eval.py
      - data/splits
      - configs/model_config.yaml
    outs:
      - models/blooms_classifier.pkl:
          cache: true
    params:
      - configs/model_config.yaml:
          - global.random_seed
          - global.test_size
          - tfidf
          - blooms_classifier

  # ── Stage 3: Train Computational Thinking (CT) Classifier ─────────────────
  train_ct:
    cmd: python -m src.models.ct_classifier --config configs/model_config.yaml --data-path data/splits/ct_train.parquet --eval-path data/splits/ct_rvce_eval.parquet --model-out models/ct_classifier.pkl
    deps:
      - src/models/ct_classifier.py
      - src/models/rvce_eval.py
      - data/splits
      - configs/model_config.yaml
    outs:
      - models/ct_classifier.pkl:
          cache: true
    params:
      - configs/model_config.yaml:
          - global.random_seed
          - global.test_size
          - tfidf
          - ct_classifier

  # ── Stage 4: Semantic Duplicate Detection ─────────────────────────────────
  detect_duplicates:
    cmd: python -m src.models.duplicate_detector --config configs/model_config.yaml --input data/raw/rvce/question_bank.json --out-dir models
    deps:
      - src/models/duplicate_detector.py
      - data/raw
      - configs/model_config.yaml
    outs:
      - models/duplicates_question_bank.parquet:
          cache: true
    params:
      - configs/model_config.yaml:
          - duplicate_detector
