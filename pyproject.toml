[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "questioncraft"
version = "1.0.0"
description = "End-to-end MLOps pipeline for OBE-compliant question classification at RVCE"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RVCE MLOps Team" }]

dependencies = [
    # Core ML
    "scikit-learn==1.4.2",
    "xgboost==2.0.3",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scipy==1.13.0",

    # NLP & Transformers
    "transformers==4.40.2",
    "sentence-transformers==2.7.0",
    "torch==2.3.0",
    "tokenizers==0.19.1",
    "nltk==3.8.1",
    "textstat==0.7.3",

    # HuggingFace Data
    "datasets==2.19.1",
    "huggingface-hub==0.23.0",
    "pyarrow==16.1.0",
    "fastparquet==2024.2.0",

    # MLOps
    "mlflow==2.13.0",
    "dvc==3.51.0",

    # Config & Utils
    "pyyaml==6.0.1",
    "python-dotenv==1.0.1",
    "tqdm==4.66.4",
    "joblib==1.4.2",
    "click==8.1.7",
]

[project.optional-dependencies]
dev = [
    "ipykernel==6.29.4",
    "jupyter==1.0.0",
    "matplotlib==3.9.0",
    "seaborn==0.13.2",
    "black==24.4.2",
    "ruff==0.4.5",
    "pre-commit==3.7.1",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ── Reproducibility ────────────────────────────────────────────────────────────
[tool.questioncraft]
random_seed = 42
numpy_seed  = 42
torch_seed  = 42

# ── Pytest ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

# ── Ruff linter ────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP"]

# ── Black formatter ────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py310"]

